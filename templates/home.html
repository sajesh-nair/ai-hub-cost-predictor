<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inference Cost Predictor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
            margin-bottom: 30px;
        }
        h2 { color: #4f46e5; margin-top: 0; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
        }
        input:focus, select:focus {
            border-color: #4f46e5;
            outline: none;
        }
        button {
            background-color: #4f46e5;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background-color: #4338ca; }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #1a2e1a;
            border-left: 5px solid #22c55e;
            border-radius: 4px;
        }
        .result-title { color: #22c55e; font-weight: bold; margin-bottom: 5px; }
        .result-val { font-size: 24px; font-weight: bold; }
        
        /* Footer Styling */
        .footer {
            text-align: center;
            font-size: 14px;
            color: #777;
            margin-top: auto;
            border-top: 1px solid #2d2d2d;
            padding-top: 15px;
            width: 100%;
            max-width: 600px;
        }
        .footer a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
        }
        .footer a:hover {
            text-decoration: underline;
            color: #6366f1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Inference Cost Predictor</h2>
    <p>Enter the model architectural telemetry to calculate the fair market prediction per million tokens.</p>
    <hr style="border-color: #333; margin-bottom: 20px;">

    <form action="/predict" method="POST">
        <div class="form-group">
            <label>Absolute Intelligence Index (0 - 100)</label>
            <input type="number" step="0.01" name="aa_intelligence_index" placeholder="e.g. 78.4" required>
        </div>
        <div class="form-group">
            <label>Coding Index (0 - 100)</label>
            <input type="number" step="0.01" name="aa_coding_index" placeholder="e.g. 72.1" required>
        </div>
        <div class="form-group">
            <label>Composite Benchmark Score (0 - 100)</label>
            <input type="number" step="0.01" name="composite_benchmark" placeholder="e.g. 65.8" required>
        </div>
        <div class="form-group">
            <label>Parameter Count (Billions)</label>
            <input type="number" step="0.1" name="parameter_count" placeholder="e.g. 70.0" required>
        </div>
        <div class="form-group">
            <label>Output Tokens Per Second</label>
            <input type="number" step="0.1" name="output_tokens_per_second" placeholder="e.g. 55.2" required>
        </div>
        <div class="form-group">
            <label>Time to First Token (Seconds)</label>
            <input type="number" step="0.001" name="time_to_first_token_s" placeholder="e.g. 0.18" required>
        </div>
        <div class="form-group">
            <label>Infrastructure Provider</label>
            <select name="provider" required>
                <option value="OpenAI">OpenAI</option>
                <option value="Anthropic">Anthropic</option>
                <option value="Google">Google</option>
                <option value="DeepSeek">DeepSeek</option>
                <option value="Meta">Meta</option>
                <option value="Mistral">Mistral</option>
                <option value="Cohere">Cohere</option>
            </select>
        </div>
        <div class="form-group">
            <label>Model Nature Type</label>
            <select name="is_open_source" required>
                <option value="False">Closed Source / Commercial API</option>
                <option value="True">Open Source / Self-Hosted Weight</option>
            </select>
        </div>

        <button type="submit">Predict Inference Cost</button>
    </form>

    {% if results %}
    <div class="result-box">
        <div class="result-title">🎯 Estimated Cost Value:</div>
        <div class="result-val">${{ results }} <span style="font-size: 14px; font-weight: normal; color: #aaa;">USD / 1M Tokens</span></div>
    </div>
    {% endif %}
</div>

<div class="footer">
    Developed by <a href="https://huggingface.co/spaces/sajesh-nair-ai/inference-cost-predictor" target="_blank">Sajesh Nair</a> | 
    Dataset sourced from <a href="https://www.kaggle.com/datasets/kanchana1990/llm-price-performance-tracker-march-2026" target="_blank">Kaggle</a>
</div>

</body>
</html>
